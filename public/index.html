<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuru Job Connect</title>
<meta name="description" content="Current jobs and scholarships in Uganda, with closing dates and how to apply.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1>Nuru Job Connect</h1>
    <p class="lede">Jobs and scholarships in Uganda, checked against their closing dates.</p>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
</header>
<main class="wrap">
  <div class="controls">
    <input id="q" type="search" placeholder="Search by title, place or skill" aria-label="Search listings">
    <label class="check"><input type="checkbox" id="closed"> Show closed</label>
  </div>
  <div class="chips" id="chips" aria-label="Categories"></div>
  <p id="count" aria-live="polite"></p>
  <div id="list"></div>
</main>
<footer class="wrap"><p id="updated"></p></footer>
<script src="app.js"></script>
</body>
</html>
